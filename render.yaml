# Render Blueprint: New + > Blueprint > pick this repo. Render asks for LLM_API_KEY once.
services:
  - type: web
    name: athex-rag
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false            # secret: entered in the Render dashboard, never in git
      - key: ATHEX_LLM
        value: groq:qwen/qwen3.8-27b
      - key: ATHEX_RATE_PER_MINUTE
        value: "6"             # per visitor
      - key: ATHEX_RATE_PER_DAY
        value: "300"           # whole demo: protects the free LLM quota
      - key: ATHEX_LLM_MAX_RETRIES
        value: "2"
