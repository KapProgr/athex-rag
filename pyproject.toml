[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athex-rag"
version = "0.1.0"
description = "Question answering with page-level citations over annual reports of Athens Stock Exchange listed companies, with a reproducible evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vlasios Kapetanis" }]
dependencies = [
    "numpy>=1.24",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]
deploy = ["huggingface_hub>=0.24"]

[project.scripts]
athex-rag = "athex_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
athex_rag = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"eval/build_questions.py" = ["E501", "E741"]
